<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Красивый Список Дел</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #9370db 0%, #8a2be2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(128, 0, 128, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #9370db 0%, #8a2be2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .input-section {
            padding: 25px;
            background: #f8f9fa;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        #taskInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #d8bfd8;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
        }

        #taskInput:focus {
            border-color: #9370db;
        }

        #addButton {
            padding: 15px 25px;
            background: linear-gradient(135deg, #9370db, #8a2be2);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        #addButton:hover {
            background: linear-gradient(135deg, #8a2be2, #9370db);
        }

        .tasks-section {
            padding: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid #eee;
            transition: all 0.4s ease;
        }

        .task-item:hover {
            background: #f8f9fa;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #9370db;
            transition: all 0.3s ease;
        }

        .task-text {
            flex: 1;
            margin: 0 15px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
            font-weight: bold;
            opacity: 0.7;
        }

        .delete-btn {
            background: #d8bfd8;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #dda0dd;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 50px 25px;
            color: #666;
        }

        .empty-state.hidden {
            display: none;
        }

        /* Улучшенная анимация исчезания */
        .task-item.removing {
            animation: smoothRemove 0.6s ease-in-out forwards;
        }

        @keyframes smoothRemove {
            0% {
                opacity: 1;
                transform: translateX(0) scale(1);
                max-height: 100px;
                padding: 15px 25px;
                margin: 0;
            }
            50% {
                opacity: 0.5;
                transform: translateX(20px) scale(0.95);
                background: #ffe6e6;
            }
            100% {
                opacity: 0;
                transform: translateX(100%) scale(0.9);
                max-height: 0;
                padding: 0 25px;
                margin: 0;
                border: none;
            }
        }

        /* Анимация появления */
        .task-item.adding {
            animation: smoothAdd 0.5s ease-out forwards;
        }

        @keyframes smoothAdd {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.8);
                max-height: 0;
                padding: 0 25px;
            }
            70% {
                opacity: 0.7;
                transform: translateY(5px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                max-height: 100px;
                padding: 15px 25px;
            }
        }

        /* Анимация выполнения задачи */
        .task-item.completing {
            animation: completeTask 0.4s ease-out;
        }

        @keyframes completeTask {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
                background: #f0f8ff;
            }
            100% {
                transform: scale(1);
            }
        }

        @media (max-width: 480px) {
            .input-group {
                flex-direction: column;
            }
            
            #taskInput, #addButton {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Список Дел ✨</h1>
            <p>Добавляйте и управляйте задачами</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Введите новую задачу...">
                <button id="addButton">Добавить</button>
            </div>
        </div>

        <div class="tasks-section">
            <div id="emptyState" class="empty-state">
                <h3> Пока нет задач!</h3>
                <p>Добавьте первую задачу выше</p>
            </div>
            <div id="taskList"></div>
        </div>
    </div>

    <script>
        // Элементы DOM
        const taskInput = document.getElementById('taskInput');
        const addButton = document.getElementById('addButton');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');

        // Добавление задачи по клику
        addButton.addEventListener('click', addTask);

        // Добавление задачи по Enter
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Функция добавления задачи
        function addTask() {
            const text = taskInput.value.trim();
            
            if (!text) {
                // Анимация тряски при пустом вводе
                taskInput.style.animation = 'shake 0.5s ease-in-out';
                setTimeout(() => {
                    taskInput.style.animation = '';
                }, 500);
                return;
            }

            createTaskElement(text);
            taskInput.value = '';
            updateUI();
            taskInput.focus();
        }

        // Создание элемента задачи
        function createTaskElement(text) {
            const taskDiv = document.createElement('div');
            taskDiv.className = 'task-item adding';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'task-checkbox';
            
            const span = document.createElement('span');
            span.className = 'task-text';
            span.textContent = text;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = 'Удалить';
            
            // Обработчик для чекбокса - выделение жирным выполненные задачи
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    span.classList.add('completed');
                    // Анимация при выполнении задачи
                    taskDiv.classList.add('completing');
                    setTimeout(() => {
                        taskDiv.classList.remove('completing');
                    }, 400);
                } else {
                    span.classList.remove('completed');
                }
            });
            
            // Обработчик для кнопки удаления с улучшенной анимацией
            deleteBtn.addEventListener('click', function() {
                // Добавляем класс для анимации удаления
                taskDiv.classList.add('removing');
                
                // Блокируем взаимодействие во время анимации
                deleteBtn.disabled = true;
                checkbox.disabled = true;
                
                // Удаляем элемент после завершения анимации
                setTimeout(() => {
                    taskDiv.remove();
                    updateUI();
                }, 600); // Время должно совпадать с длительностью анимации
            });
            
            taskDiv.appendChild(checkbox);
            taskDiv.appendChild(span);
            taskDiv.appendChild(deleteBtn);
            taskList.appendChild(taskDiv);

            // Убираем класс добавления после анимации
            setTimeout(() => {
                taskDiv.classList.remove('adding');
            }, 500);
        }

        // Обновление интерфейса
        function updateUI() {
            const tasks = document.querySelectorAll('.task-item');
            
            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        // Анимация тряски для пустого ввода
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        // Фокус на поле ввода при загрузке
        taskInput.focus();
    </script>
</body>
</html>
